<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <!-- Include Bootstrap CSS for styling the page -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-center py-5">
    <!-- Main container for the card -->
    <div class="container">
        <!-- Card component to hold the password generator UI -->
        <div class="card shadow-lg p-4 rounded">
            <!-- Page header -->
            <h1 class="text-success mb-4">Password Generator</h1>

            <!-- Input for user to enter desired password length -->
            <input type="number" id="lengthInput" class="form-control mb-3" placeholder="Enter password length" min="4" max="50">

            <!-- Paragraph to display the generated password -->
            <p id="password" class="fw-bold fs-4">PASSWORD</p>

            <!-- Button to generate a new password -->
            <button class="btn btn-success mb-3" onclick="generatePassword()">GET PASSWORD</button>

            <!-- Button to copy the generated password to clipboard -->
            <button class="btn btn-secondary mb-3" onclick="copyPassword()">COPY</button>

            <!-- Feedback message displayed after copying password -->
            <p id="copyMessage" class="text-info mt-2" style="display: none;">Succeeded</p>

        </div>
    </div>

    <script>
        // Function to generate a random password
        function generatePassword() {
            // Get the password length entered by the user
            let length = document.getElementById("lengthInput").value;
            length = parseInt(length); // Convert input to integer

            // Validate the input length
            if (isNaN(length) || length < 6 || length > 50) {
                alert("Please enter a valid size between 6 and 50");
                return; // Stop execution if input is invalid
            }

            // Define the characters that can be used in the password
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}|;:,.<>?";

            let password = "";
            // Loop to build the password character by character
            for (let i = 0; i < length; i++) {
                // Randomly select a character from 'chars' and append it
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // Display the generated password in the paragraph element
            document.getElementById("password").textContent = password;
        }

        // Function to copy the generated password to the clipboard
        function copyPassword() {
            const passwordText = document.getElementById("password").textContent;

            // Use Clipboard API to write text to the user's clipboard
            navigator.clipboard.writeText(passwordText).then(() => {
                const message = document.getElementById("copyMessage");

                // Show feedback message
                message.style.display = "block";

                // Hide the message after 2 seconds
                setTimeout(() => {
                    message.style.display = "none";
                }, 2000);
            });
        }
    </script>

</body>

</html>
